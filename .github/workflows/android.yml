name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Print exact source revision
        run: |
          echo "Building commit: $GITHUB_SHA"
          git log -1 --format='%h %s'
          grep -E 'versionName|versionCode|targetSdk' app/build.gradle
          grep -n 'PICK UP' app/src/main/java/com/nolimits/survival/MainActivity.java
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Inspect compiled APK metadata
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -E "package:|targetSdkVersion:|sdkVersion:"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -q "targetSdkVersion:'35'"
          EXPECTED_CODE=$(awk '/^[[:space:]]*versionCode[[:space:]]+[0-9]+/ { print $2; exit }' app/build.gradle)
          test -n "$EXPECTED_CODE"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "versionCode='$EXPECTED_CODE'"
          echo "Verified APK versionCode=$EXPECTED_CODE"
      - name: Record APK provenance
        run: |
          mkdir -p apk-release
          cp app/build/outputs/apk/debug/app-debug.apk apk-release/NO-LIMITS-SURVIVAL-1.4-survival.apk
          printf 'Commit: %s\nVersion: 1.4-survival\nPackage: com.nolimits.survival\n' "$GITHUB_SHA" > apk-release/BUILD-INFO.txt
          sha256sum apk-release/*.apk >> apk-release/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NO-LIMITS-SURVIVAL-1.4-survival-${{ github.run_number }}
          path: apk-release/
          if-no-files-found: error
      - name: Publish APK directly in GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-prototype-v1.4
          name: NO LIMITS SURVIVAL Android prototype v1.4
          body: |
            Experimental lightweight Android prototype (not the Godot 3D game).
            Built from commit ${{ github.sha }}.
            Download the .apk asset directly; no ZIP extraction required.
          files: |
            apk-release/*.apk
            apk-release/BUILD-INFO.txt
          fail_on_unmatched_files: true
