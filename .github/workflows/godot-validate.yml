name: Validate Godot 3D Project
on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-validate.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import and parse Godot project
        run: |
          docker run --rm -v "$PWD/godot:/project" -w /project barichello/godot-ci:4.3 godot --headless --editor --path /project --import --quit
      - name: Check project startup
        run: |
          timeout 35s docker run --rm -v "$PWD/godot:/project" -w /project barichello/godot-ci:4.3 godot --headless --path /project --quit-after 10
