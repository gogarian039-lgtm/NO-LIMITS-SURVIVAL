name: Build NO LIMITS SURVIVAL 3D APK

on:
  workflow_dispatch:
  push:
    branches: [godot-3d-open-world]
    paths:
      - 'godot3d/**'
      - '.github/workflows/godot-3d-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Check Android export environment
        shell: bash
        run: |
          set -euxo pipefail
          godot --version
          command -v keytool
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          ls -la /root/.local/share/godot/export_templates || true
          mkdir -p godot3d/build /root/.android
      - name: Configure Godot Android export
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p /root/.config/godot
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "/root/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$SDK" > /root/.config/godot/editor_settings-4.tres
      - name: Import Godot project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path godot3d --editor --import
      - name: Export debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd godot3d
          godot --headless --path . --export-debug Android build/NO-LIMITS-SURVIVAL-3D.apk
          test -s build/NO-LIMITS-SURVIVAL-3D.apk
          ls -lh build/NO-LIMITS-SURVIVAL-3D.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NO-LIMITS-SURVIVAL-3D-APK
          path: godot3d/build/NO-LIMITS-SURVIVAL-3D.apk
          if-no-files-found: error
