name: Build NO LIMITS SURVIVAL 3D APK

on:
  workflow_dispatch:
  push:
    branches: [godot-3d-open-world]
    paths:
      - 'godot3d/**'
      - '.github/workflows/godot-3d-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates and locate Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          godot --version
          apt-get update
          apt-get install -y --no-install-recommends curl unzip
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable" "$HOME/.android" godot3d/build
          if [ ! -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk" ]; then
            curl -fL --retry 3 -o /tmp/godot_templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
            unzip -oq /tmp/godot_templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d /tmp/godot-export
            cp /tmp/godot-export/templates/android_*.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            for candidate in /opt/android-sdk /opt/android-sdk-linux /usr/local/lib/android/sdk /usr/local/android-sdk; do
              if [ -d "$candidate/platforms" ]; then SDK="$candidate"; break; fi
            done
          fi
          test -n "$SDK"
          test -d "$SDK/platforms"
          # Godot 4.4 Android export requires Android SDK platform 35 and build-tools 35.0.0.
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 -o /tmp/android-cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -oq /tmp/android-cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
          JAVA="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          test -d "$JAVA"
          echo "GODOT_ANDROID_SDK_PATH=$SDK" >> "$GITHUB_ENV"
          echo "GODOT_JAVA_SDK_PATH=$JAVA" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          # Persist the Android SDK settings for the separate export process.
          SDK="$SDK" JAVA="$JAVA" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path.home() / ".config/godot/editor_settings-4.4.tres"
          content = ('[gd_resource type="EditorSettings" format=3]' + chr(10)*2 +
                     '[resource]' + chr(10) +
                     'export/android/android_sdk_path = ' + json.dumps(os.environ["SDK"]) + chr(10) +
                     'export/android/java_sdk_path = ' + json.dumps(os.environ["JAVA"]) + chr(10))
          path.write_text(content)
          print(path, repr(content))
          PY
          test -s "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          ls "$SDK/build-tools" || true
      - name: Create Android debug signing key
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Import Godot project
        shell: bash
        run: |
          godot --headless --path godot3d --editor --import
          echo "Godot import complete; SDK settings persisted before export"
      - name: Export debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd godot3d
          godot --headless --path . --export-debug Android build/NO-LIMITS-SURVIVAL-3D.apk
          test -s build/NO-LIMITS-SURVIVAL-3D.apk
          ls -lh build/NO-LIMITS-SURVIVAL-3D.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NO-LIMITS-SURVIVAL-3D-APK
          path: godot3d/build/NO-LIMITS-SURVIVAL-3D.apk
          if-no-files-found: error
