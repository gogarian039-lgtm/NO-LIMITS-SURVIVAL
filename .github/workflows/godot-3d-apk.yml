name: Build NO LIMITS SURVIVAL 3D APK

on:
  workflow_dispatch:
  push:
    branches: [godot-3d-open-world]
    paths:
      - 'godot3d/**'
      - '.github/workflows/godot-3d-apk.yml'

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android platforms and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Install official Godot 4.4.1 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -oq /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -oq /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/android_*.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          mkdir -p "$HOME/.android" godot3d/build

      - name: Configure Godot Android editor settings and debug signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          sdk = os.environ["ANDROID_HOME"]
          java = os.environ["JAVA_HOME"]
          keystore = str(Path.home() / ".android/debug.keystore")
          settings = Path.home() / ".config/godot/editor_settings-4.4.tres"
          settings.parent.mkdir(parents=True, exist_ok=True)
          options = {
              "export/android/android_sdk_path": sdk,
              "export/android/java_sdk_path": java,
              "export/android/debug_keystore": keystore,
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }
          settings.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' + ''.join(k + ' = ' + json.dumps(v) + '\n' for k, v in options.items()))
          print(settings.read_text())
          preset = Path("godot3d/export_presets.cfg")
          data = preset.read_text()
          data = data.replace('keystore/debug=""', 'keystore/debug="' + keystore + '"')
          preset.write_text(data)
          print("Configured Android debug keystore:", keystore)
          PY

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path godot3d --editor --import
          echo "Checking Godot editor configuration:"
          grep -E 'export/android/(android_sdk_path|java_sdk_path|debug_keystore)' "$HOME/.config/godot/editor_settings-4.4.tres" || true
          echo "Checking Android export templates:"
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          echo "Checking Android export preset:"
          grep -E '^(name|platform|package/unique_name|keystore/debug|architectures/arm64-v8a)=' godot3d/export_presets.cfg
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -f "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
          echo "Installed SDK paths:"
          ls -ld "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0" "$ANDROID_HOME/platform-tools"

      - name: Diagnose Godot Android export configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > godot3d/ci_export_diagnostics.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
              var settings := EditorInterface.get_editor_settings()
              var sdk := OS.get_environment("ANDROID_HOME")
              var java := OS.get_environment("JAVA_HOME")
              var key := OS.get_environment("HOME").path_join(".android/debug.keystore")
              var values := {
                  "export/android/android_sdk_path": sdk,
                  "export/android/java_sdk_path": java,
                  "export/android/debug_keystore": key,
                  "export/android/debug_keystore_user": "androiddebugkey",
                  "export/android/debug_keystore_pass": "android",
              }
              for setting in values:
                  settings.set_setting(setting, values[setting])
                  print("CI configured ", setting, " = ", "<hidden>" if setting.ends_with("_pass") else values[setting])
              settings.save()
              quit()
          GDSCRIPT
          godot --headless --path godot3d --editor --script res://ci_export_diagnostics.gd
          rm -f godot3d/ci_export_diagnostics.gd

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools"
          ls -la "$ANDROID_HOME/platforms"
          cd godot3d
          set +e
          godot --headless --verbose --path . --export-debug Android build/NO-LIMITS-SURVIVAL-3D.apk 2>&1 | tee build/export.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::Godot Android export failed (exit $result). Relevant diagnostics:"
            grep -Ei "error|failed|invalid|missing|cannot|could not|configuration|keystore|sdk|template" build/export.log | tail -100 || true
            exit "$result"
          fi
          test -s build/NO-LIMITS-SURVIVAL-3D.apk
          ls -lh build/NO-LIMITS-SURVIVAL-3D.apk

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-export-diagnostics
          path: godot3d/build/export.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NO-LIMITS-SURVIVAL-3D-APK
          path: godot3d/build/NO-LIMITS-SURVIVAL-3D.apk
          if-no-files-found: error
